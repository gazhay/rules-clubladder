name: Deploy MkDocs with PDF

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install System Dependencies for PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 fonts-noto-color-emoji

      - name: Install Python Dependencies
        run: |
          pip install mkdocs-material mkdocs-with-pdf
      - name: Inject Git Commit into MkDocs Config
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_DATE=$(git log -1 --format=%cd --date=short)
          # Appends or updates cover_subtitle under the with-pdf plugin block
          sed -i 's/cover_subtitle: .*/cover_subtitle: "Build: '$COMMIT_HASH' ($COMMIT_DATE)"/' mkdocs.yml

      - name: Build MkDocs Site & PDF
        run: mkdocs build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
